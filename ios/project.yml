name: CardRoom
options:
  bundleIdPrefix: com.cardroom
  deploymentTarget:
    iOS: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  CardRoom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CardRoom
    info:
      path: CardRoom/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cardroom.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Supabase
        product: Supabase
